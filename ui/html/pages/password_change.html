{{define "title"}}Change Password - Snippetbox{{end}}

{{define "main"}}
<h2>Change password</h2>
<form action="/account/password/update" method="post">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    {{range .Form.NonFieldErrors}}
        <div class="error">{{.}}</div>
    {{end}}
    <div>
        <label for="currentPassword">Current password:</label>
        {{with .Form.FieldErrors.current_password}}
            <label class="error">{{.}}</label>
        {{end}}
        <input type="password" name="currentPassword" tabindex="1">
    </div>
    <div>
        <label for="newPassword">New password:</label>
        {{with .Form.FieldErrors.new_password}}
            <label class="error">{{.}}</label>
        {{end}}
        <input type="password" name="newPassword" tabindex="2">
    </div>
    <div>
        <label for="confirmNewPassword">Confirm new password:</label>
        {{with .Form.FieldErrors.confirm_new_password}}
            <label class="error">{{.}}</label>
        {{end}}
        <input type="password" name="confirmNewPassword" tabindex="3">
    </div>
    <input type="submit" value="Change password">
</form>
{{end}}
